<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Penjualan UMKM</title>
<style>
:root{--bg:#f7f7f6;--panel:#fff;--tx:#1b1d1f;--mu:#6b7076;--ln:#e4e5e3;--ac:#14532d;--ac2:#86a897;--wr:#a16207;--bd:#b91c1c;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1110;--panel:#171a18;--tx:#eceeec;--mu:#9aa09c;--ln:#2a2e2b;--ac:#6fcf97;--ac2:#35523f;--wr:#e0b44a;--bd:#f07171;--ok:#6fcf97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:36px 20px 72px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.02em}
.sub{color:var(--mu);font-size:13px;margin-top:2px}
.tabs{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--panel)}
.tabs button{border:0;border-right:1px solid var(--ln);background:none;color:var(--mu);padding:7px 16px;font:inherit;font-size:13px;cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--ac);color:var(--bg);font-weight:500}
.tabs button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln);border-radius:10px;background:var(--panel);margin-bottom:36px}
.strip div{padding:18px 20px;border-right:1px solid var(--ln)}
.strip div:last-child{border-right:0}
.lbl{color:var(--mu);font-size:13px}
.val{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.val.big{color:var(--ac)}
.hint{color:var(--mu);font-size:12.5px}
section{margin-bottom:40px}
h2{font-size:16px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.desc{color:var(--mu);font-size:13px;margin:0 0 16px}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:36px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mu);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mu);font-size:13px;padding:0 12px 10px 0;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:11px 12px 11px 0;border-bottom:1px solid var(--ln);white-space:nowrap}
tr:last-child td{border-bottom:0}
.r{text-align:right;padding-right:0}th.r{padding-right:0}
td:last-child,th:last-child{padding-right:0}
.bar{display:inline-block;vertical-align:middle;height:6px;border-radius:3px;background:var(--ac);margin-left:10px}
.top td:nth-child(2){font-weight:600}
.pill{font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.aman{color:var(--ok)}.menipis{color:var(--wr)}.habis{color:var(--bd)}
.pf{margin-bottom:18px}.pf:last-child{margin-bottom:0}
.pf b{font-weight:600}.pf .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.track{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.track i{display:block;height:100%;background:var(--ac)}
ul.ins{margin:0;padding:0;list-style:none}
ul.ins li{padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
ul.ins li:last-child{border-bottom:0}
.empty{padding:60px 20px;text-align:center;color:var(--mu)}
code{background:var(--ln);padding:2px 6px;border-radius:4px;font-size:13px}
footer{color:var(--mu);font-size:12.5px;margin-top:48px}
@media(max-width:820px){.strip{grid-template-columns:1fr 1fr}.strip div:nth-child(2){border-right:0}.strip div:nth-child(-n+2){border-bottom:1px solid var(--ln)}.cols{grid-template-columns:1fr;gap:36px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
const app = document.getElementById("app");
const D = window.DATA;
if (!D) {
  app.innerHTML = '<div class="empty">Data belum ada.<br>Jalankan <code>python analisis.py</code> lalu muat ulang halaman ini.</div>';
} else {
  let filter = "semua";
  const rp = n => "Rp " + Math.round(n).toLocaleString("id-ID");
  const num = n => Math.round(n).toLocaleString("id-ID");
  const tgl = s => new Date(s + "T00:00:00").toLocaleDateString("id-ID", {day: "numeric", month: "short"});
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const NAMA = {semua: "Semua platform", shopee: "Shopee", tokopedia: "Tokopedia"};

  function chart(t) {
    const W = 640, H = 170, n = t.length, bw = W / n;
    const mx = Math.max(1, ...t.map(d => d.omzet));
    let s = `<svg viewBox="0 0 ${W} ${H + 20}" width="100%" role="img" aria-label="Grafik omzet dan laba harian">`;
    t.forEach((d, i) => {
      const h = d.omzet / mx * H;
      s += `<rect x="${i * bw + 1.5}" y="${H - h}" width="${Math.max(bw - 3, 1)}" height="${h}" rx="2" fill="var(--ac2)"><title>${tgl(d.tanggal)}: omzet ${rp(d.omzet)}, laba ${rp(d.laba)}</title></rect>`;
    });
    const pts = t.map((d, i) => `${(i * bw + bw / 2).toFixed(1)},${(H - Math.max(d.laba, 0) / mx * H).toFixed(1)}`).join(" ");
    s += `<polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/>`;
    s += `<text x="0" y="${H + 15}" font-size="11" fill="var(--mu)">${tgl(t[0].tanggal)}</text>`;
    s += `<text x="${W}" y="${H + 15}" font-size="11" fill="var(--mu)" text-anchor="end">${tgl(t[n - 1].tanggal)}</text></svg>`;
    return s;
  }

  function render() {
    const A = D.analisis[filter], R = A.ringkasan;
    const mxUnit = Math.max(1, ...A.produk.map(p => p.unit));
    const mxPf = Math.max(1, ...D.platform.map(p => p.omzet));
    const p = D.periode;

    app.innerHTML = `
    <header>
      <div>
        <h1>Penjualan UMKM</h1>
        <div class="sub">${tgl(p.awal)} sampai ${tgl(p.akhir)} · ${p.hari} hari · Shopee dan Tokopedia digabung</div>
      </div>
      <div class="tabs" role="group" aria-label="Pilih platform">
        ${Object.keys(NAMA).map(k => `<button data-f="${k}" class="${k === filter ? "on" : ""}" aria-pressed="${k === filter}">${NAMA[k]}</button>`).join("")}
      </div>
    </header>

    <div class="strip">
      <div><div class="lbl">Omzet</div><div class="val">${rp(R.omzet)}</div><div class="hint">${num(R.order)} pesanan</div></div>
      <div><div class="lbl">Laba bersih</div><div class="val big">${rp(R.laba)}</div><div class="hint">margin ${R.margin}%</div></div>
      <div><div class="lbl">Unit terjual</div><div class="val">${num(R.unit)}</div><div class="hint">modal ${rp(R.modal)}</div></div>
      <div><div class="lbl">Nilai stok gudang</div><div class="val">${rp(D.nilai_stok_total)}</div><div class="hint">dihitung dari harga modal</div></div>
    </div>

    <section>
      <h2>Tren harian</h2>
      <p class="desc">${NAMA[filter]}. Arahkan kursor ke batang untuk melihat angkanya.</p>
      <div class="legend"><span><i style="background:var(--ac2)"></i>Omzet</span><span><i style="background:var(--ac)"></i>Laba</span></div>
      ${chart(A.tren)}
    </section>

    <section class="cols">
      <div>
        <h2>Ringkasan analisis</h2>
        <p class="desc">Dihitung otomatis oleh analisis.py.</p>
        <ul class="ins">${A.insight.map(t => `<li>${esc(t)}</li>`).join("") || "<li>Belum ada data.</li>"}</ul>
      </div>
      <div>
        <h2>Kontribusi platform</h2>
        <p class="desc">Omzet dan laba tiap marketplace.</p>
        ${D.platform.map(x => `<div class="pf"><div class="row"><b>${x.nama}</b><span>${rp(x.laba)} laba</span></div>
          <div class="track"><i style="width:${x.omzet / mxPf * 100}%"></i></div>
          <div class="hint">omzet ${rp(x.omzet)} · ${num(x.unit)} unit</div></div>`).join("")}
      </div>
    </section>

    <section>
      <h2>Produk terlaris</h2>
      <p class="desc">Diurutkan dari jumlah unit terjual.</p>
      <div class="tw"><table>
        <thead><tr><th>Produk</th><th>Terjual</th><th class="r">Omzet</th><th class="r">Laba</th><th class="r">Margin</th></tr></thead>
        <tbody>${A.produk.map(x => `<tr class="${x.peringkat === 1 ? "top" : ""}">
          <td>${esc(x.nama)}</td>
          <td>${num(x.unit)}<span class="bar" style="width:${x.unit / mxUnit * 90}px"></span></td>
          <td class="r">${rp(x.omzet)}</td><td class="r">${rp(x.laba)}</td><td class="r">${x.margin}%</td></tr>`).join("")}
        </tbody></table></div>
    </section>

    <section>
      <h2>Stok gudang</h2>
      <p class="desc">Sisa stok = stok awal dikurangi penjualan di semua platform. Produk yang perlu restock tampil paling atas.</p>
      <div class="tw"><table>
        <thead><tr><th>Produk</th><th class="r">Stok awal</th><th class="r">Terjual</th><th class="r">Sisa</th><th class="r">Perkiraan habis</th><th class="r">Nilai stok</th><th class="r">Status</th></tr></thead>
        <tbody>${D.stok.map(s => `<tr>
          <td>${esc(s.nama)}</td><td class="r">${num(s.stok_awal)}</td><td class="r">${num(s.terjual)}</td>
          <td class="r"><b>${num(Math.max(s.sisa, 0))}</b></td>
          <td class="r">${s.hari_habis === null ? "-" : s.hari_habis + " hari"}</td>
          <td class="r">${rp(s.nilai_stok)}</td>
          <td class="r"><span class="pill ${s.status}">${s.status}</span></td></tr>`).join("")}
        </tbody></table></div>
    </section>

    <footer>Laba = omzet - modal produk - biaya platform. Perbarui data di folder <code>data/</code>, jalankan <code>python analisis.py</code>, lalu muat ulang halaman.</footer>`;

    app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  }
  render();
}
</script>
</body>
</html>
